<nav class="site-nav" [class.scrolled]="scrolled()">
  <div class="container-xl d-flex align-items-center justify-content-between">

    <!-- Logo -->
    <a class="nav-logo" (click)="scrollTo('home')">
      <span class="logo-bracket"></span>I David Raj<span class="logo-bracket"></span>
    </a>

    <!-- Desktop links -->
    <ul class="nav-links d-none d-md-flex list-unstyled mb-0">
      @for (link of links; track link) {
        <li><a (click)="scrollTo(link)">{{ link }}</a></li>
      }
    </ul>

    <!-- CTA -->
    <a href="mailto:davidraj.i@outlook.com" class="btn-glow d-none d-md-inline-flex">
      Hire Me
    </a>

    <!-- Hamburger -->
    <button class="hamburger d-md-none" (click)="toggle()" [class.open]="menuOpen()">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile menu -->
  @if (menuOpen()) {
    <div class="mobile-menu">
      @for (link of links; track link) {
        <a (click)="scrollTo(link)">{{ link }}</a>
      }
    </div>
  }
</nav>
